<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정처기 배틀 — 정보처리기사 실기 기출</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/index.css">
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a class="brand" href="/">정처기 배틀</a>
    <a href="/" aria-current="page">학습</a>
    <a href="/battle.html">대전</a>
    <a href="/ranking.html">랭킹</a>
    <span class="spacer"></span>
    <span class="who" id="navWho"></span>
    <!-- 로그인일 때만 보인다. 계정 상자의 로그아웃과 같은 경로를 탄다. -->
    <button type="button" id="navLogout" hidden>로그아웃</button>
    <!-- 비로그인일 때만 보인다 — 계정 섹션이 맨 아래라 여기서 바로 내려갈 수 있게. -->
    <a class="nav-login" id="navLogin" href="#account" hidden>로그인</a>
  </div>
</nav>

<main class="wrap">

  <!-- ----------------------------------------------------------- 히어로 -->
  <header class="page">
    <h1>정보처리기사 실기 복원 기출</h1>
    <p>회차를 골라 혼자 풀거나, 친구와 대전하세요 &middot; 채점은 100점 만점 (60점 이상 합격)</p>
    <!-- 최신 회차로 바로 보낸다. /api/rounds 가 오기 전에는 갈 곳을 모르니 비활성. -->
    <div class="hero-cta">
      <button class="hero-btn" id="heroStart" type="button" disabled>바로 풀어보기 &rarr;</button>
    </div>
  </header>

  <!-- ---------------------------------------------------- ?msg= 안내 -->
  <!-- 다른 화면이 로그인 때문에 되돌려 보낸 이유다 — 조작 없이 나타나므로 role="alert". -->
  <div class="msg-banner" id="msgBanner" role="alert" hidden></div>

  <!-- --------------------------------------------------------- 내 학습 -->
  <!-- 로그인 상태와 /api/me/history 응답에 따라 index 스크립트가 채운다.
       서버가 이 API 를 모르면(구버전) 섹션째 숨긴다. -->
  <h2 class="section" id="studySection" hidden>내 학습</h2>
  <div id="studyBox" hidden></div>

  <!-- ------------------------------------------------------------- 회차 -->
  <h2 class="section">회차 선택</h2>
  <!-- 유형 칩 (전체/코드/SQL/이론). /api/rounds 가 counts 를 주지 않는 구버전 서버면 계속 숨긴다. -->
  <div class="type-filter" id="roundTypeFilter" role="group" aria-label="문항 유형 필터" hidden></div>
  <!-- 언어 칩 (전체/C/Java/Python). 유형이 "코드" 일 때만 보인다 — 언어는 코드 문항에만 있는 축이다. -->
  <div class="type-filter lang-filter" id="roundLangFilter" role="group" aria-label="코드 문항 언어 필터" hidden></div>
  <div id="roundList">
    <p class="muted">회차를 불러오는 중&hellip;</p>
  </div>

  <!-- --------------------------------------------------- 랜덤 모의고사 -->
  <h2 class="section">랜덤 모의고사</h2>
  <div class="card" id="practiceBox">
    <p class="muted">회차를 불러오는 중&hellip;</p>
  </div>

  <!-- ------------------------------------------------------------- 세션 -->
  <!-- 맨 아래 — 풀기가 먼저다. ?msg= 로 되돌아온 경우에만 여기로 스크롤한다. -->
  <h2 class="section" id="account">계정</h2>
  <div class="card" id="sessionBox">
    <p class="muted">세션을 확인하는 중&hellip;</p>
  </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/fmt.js"></script>
<!-- 화면 공용 모듈(window.JPK). dom → 나머지 순서로 읽어야 한다. -->
<script src="/js/shared/dom.js"></script>
<script src="/js/shared/qmeta.js"></script>
<script src="/js/shared/motion.js"></script>
<script src="/js/shared/nav.js"></script>
<!-- 메인 화면 로직. 예전에는 이 자리에 811줄 인라인 스크립트가 있었다 (캐시·린트·검사 불가). -->
<script src="/js/index.js"></script>
</body>
</html>
