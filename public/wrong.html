<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오답노트 — 정처기 배틀</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a class="brand" href="/">정처기 배틀</a>
    <!-- 오답노트는 학습 계열이라 "학습" 에 현재 표시를 준다. -->
    <a href="/" aria-current="page">학습</a>
    <a href="/battle.html">대전</a>
    <a href="/ranking.html">랭킹</a>
    <span class="spacer"></span>
    <span class="who" id="navWho"></span>
    <button type="button" id="navLogout" hidden>로그아웃</button>
    <!-- 비로그인일 때만 보인다 — 메인의 계정 섹션으로 보낸다. -->
    <a class="nav-login" id="navLogin" href="/#account" hidden>로그인</a>
  </div>
</nav>

<!--
  오답노트 허브. 화면 내용은 전부 public/js/wrong.js 가 그린다.
  study.html 과 같은 규약으로 빈 그릇만 둔다 (부분 DOM 패치를 하지 않기 위해).
    #wrongMeta    헤더 아래 한 줄 안내
    #wrongSummary 총 N문항 · 전체 풀기 · 유형 선택
    #wrongTabs    회차별 / 대전별 탭
    #wrongBody    고른 탭의 목록 (통째로 다시 그린다)
-->

<main class="wrap">

  <header class="page">
    <h1 id="wrongTitle">오답노트</h1>
    <p id="wrongMeta">오답노트를 불러오는 중&hellip;</p>
  </header>

  <div class="notice" id="offlineNotice" role="alert" hidden></div>
  <div class="card wn-summary" id="wrongSummary" hidden></div>

  <div class="wn-tabs" id="wrongTabs" role="group" aria-label="오답 묶음 보기" hidden></div>

  <div id="wrongBody">
    <p class="muted">오답노트를 불러오는 중&hellip;</p>
  </div>

</main>

<!-- 토스트는 조작 없이 사라지는 짧은 알림이다 — 보조 기술에도 즉시 읽히도록 role="alert". -->
<div class="toast-wrap" id="toastWrap" role="alert"></div>

<script src="/js/api.js"></script>
<script src="/js/fmt.js"></script>
<!-- 화면 공용 모듈(window.JPK). dom → 나머지 순서로 읽어야 한다. -->
<script src="/js/shared/dom.js"></script>
<script src="/js/shared/store.js"></script>
<script src="/js/shared/qmeta.js"></script>
<script src="/js/shared/net.js"></script>
<script src="/js/shared/nav.js"></script>
<script src="/js/wrong.js"></script>
</body>
</html>
